[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Bounded-autonomy insurance claims triage agent"
requires-python = "==3.11.*"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "requires_model: needs the sentence-transformers model; run via make test-model or make verify",
]
